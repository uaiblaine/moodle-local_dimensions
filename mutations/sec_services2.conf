# Mutation spec for group B2 - identity-field disclosure in search_assignable_users.php, and
# error-message escaping in template_csv_importer.php / get_course_progress.php. Run from the
# repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_services2.conf" --stack m502`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
#     tag | file relative to the repo | perl script relative to this file

# Identity fields must come from core's viewuseridentity/showuseridentity/hiddenuserfields
# resolution, not a fixed email/idnumber/username set.
SB2_M01_identity_fields_fixed_set              | classes/external/search_assignable_users.php | sb2_m01_identity_fields_fixed_set.pl
#   -> local_dimensions\external\assignable_users_test::test_default_identity_is_the_email_alone
#   -> local_dimensions\external\assignable_users_test::test_only_listed_identity_fields_are_searched
#   -> local_dimensions\external\assignable_users_test::test_without_viewuseridentity_no_identity_is_searched_or_shown
#   -> local_dimensions\external\assignable_users_test::test_search_matches_identity_fields

# Without moodle/site:viewuseridentity, get_identity_fields() must return nothing to search/show.
SB2_M02_viewuseridentity_gate_bypassed         | classes/external/search_assignable_users.php | sb2_m02_viewuseridentity_gate_bypassed.pl
#   -> local_dimensions\external\assignable_users_test::test_without_viewuseridentity_no_identity_is_searched_or_shown

# An arbitrary showuseridentity entry (e.g. password) must never reach SQL/selects/output -
# IDENTITY_COLUMNS is the allowlist that keeps it out.
SB2_M03_identity_columns_allowlist_dropped     | classes/external/search_assignable_users.php | sb2_m03_identity_columns_allowlist_dropped.pl
#   -> local_dimensions\external\assignable_users_test::test_an_unknown_identity_entry_is_never_selected

# The LIKE search must cover the allowed identity fields, not just the name.
SB2_M04_identity_like_search_dropped           | classes/external/search_assignable_users.php | sb2_m04_identity_like_search_dropped.pl
#   -> local_dimensions\external\assignable_users_test::test_search_matches_identity_fields
#   -> local_dimensions\external\assignable_users_test::test_default_identity_is_the_email_alone
#   -> local_dimensions\external\assignable_users_test::test_only_listed_identity_fields_are_searched
#   -> local_dimensions\external\assignable_users_test::test_without_viewuseridentity_no_identity_is_searched_or_shown

# One named placeholder per identity field - fix_sql_params() rejects a name reused across the
# statement.
SB2_M05_duplicate_named_placeholder            | classes/external/search_assignable_users.php | sb2_m05_duplicate_named_placeholder.pl
#   -> local_dimensions\external\assignable_users_test::test_search_matches_identity_fields

# Only the allowed identity fields may be selected and joined into the 'identity' value - not a
# hardcoded email/idnumber pair.
SB2_M06_select_and_identity_reverted_to_fixed_set | classes/external/search_assignable_users.php | sb2_m06_select_and_identity_reverted_to_fixed_set.pl
#   -> local_dimensions\external\assignable_users_test::test_without_viewuseridentity_no_identity_is_searched_or_shown
#   -> local_dimensions\external\assignable_users_test::test_only_listed_identity_fields_are_searched
#   -> local_dimensions\external\assignable_users_test::test_search_matches_identity_fields

# A CSV import failure message must stay in its PARAM_TEXT spelling so a DML debuginfo carrying
# markup cannot invalidate the whole apply_import_templates response.
SB2_M07_csv_result_message_not_cleaned         | classes/local/template_csv_importer.php | sb2_m07_csv_result_message_not_cleaned.pl
#   -> local_dimensions\local\template_csv_importer_test::test_a_failure_message_keeps_the_response_valid

# get_course_progress's per-course error text must stay in its PARAM_TEXT spelling so one
# course's exception cannot invalidate the response for every course.
SB2_M08_course_progress_error_text_not_cleaned | classes/external/get_course_progress.php | sb2_m08_course_progress_error_text_not_cleaned.pl
#   -> local_dimensions\external\get_course_progress_test::test_an_error_message_with_markup_keeps_the_response_valid
