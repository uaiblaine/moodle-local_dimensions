# Mutation spec for the competency counts of the plan entity - run from the repo with
# `mdl mutate moodle-local_dimensions-502 "$PWD/mutations/plan_stats_archive.conf" --stack m502`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard in stats_join() of classes/reportbuilder/local/entities/plan.php.
#
#     tag | file relative to the repo | perl script relative to this file

# The archive branch matches no plan: a completed plan counts nothing.
PSA_A_archive_dropped  | classes/reportbuilder/local/entities/plan.php | psa_a.pl
#   -> test_completed_template_plan_keeps_its_archived_competencies

# The template branch reads only completed plans: an active template plan stops following the template.
PSA_B_template_complete_only | classes/reportbuilder/local/entities/plan.php | psa_b.pl
#   -> test_active_template_plan_follows_the_template

# The template branch loses its status filter: a completed plan counts the template again.
PSA_C_template_unfiltered | classes/reportbuilder/local/entities/plan.php | psa_c.pl
#   -> test_completed_template_plan_keeps_its_archived_competencies

# The plancomp branch loses its status filter: a completed unlinked plan counts its own rows and its archive.
PSA_D_plancomp_unfiltered | classes/reportbuilder/local/entities/plan.php | psa_d.pl
#   -> test_plan_and_template_columns
