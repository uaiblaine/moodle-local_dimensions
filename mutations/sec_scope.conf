# Mutation spec for group A - competency scope on the learner tracker page and the rules WS
# (plan_access::competency_scope()/require_competency_in_scope(), view-competency.php,
# get_competency_rule_data.php). Run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_scope.conf" --stack m502`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# This spec deliberately PRESERVES the related-competency escape hatch as a feature, not a bug:
# when a plan's template resolves both showrelated and showrelatedlink on, a competency that is
# cross-referenced from one of the plan's own competencies is legitimately reachable outside the
# plan (SCOPE_RELATED). M9-M12 mutate away the conditions that keep that hatch narrow (template
# resolution, the link sub-flag, and the "must relate to one of the plan's own competencies"
# intersection) - they must all redden, which is what proves the narrowing is real rather than
# the feature being disabled outright.
#
#     tag | file relative to the repo | perl script relative to this file

# The not-found guard: a competency outside scope must read as `false`, never a real record.
SA_M01_competency_scope_bypass                    | view-competency.php                        | sa_m01_competency_scope_bypass.pl
#   -> local_dimensions\local\plan_access_test::test_tracker_page_renders_only_a_competency_the_plan_reaches

# In-plan flag widened to any non-null scope (would also throw for a related competency, since
# get_plan_competency() only knows real plan competencies).
SA_M02_inplan_widened_to_any_scope                | view-competency.php                        | sa_m02_inplan_widened_to_any_scope.pl
#   -> local_dimensions\local\plan_access_test::test_tracker_page_renders_only_a_competency_the_plan_reaches

# In-plan flag pinned to false (the template cascade layer would never apply and the in-plan view
# would never log).
SA_M03_inplan_always_false                        | view-competency.php                        | sa_m03_inplan_always_false.pl
#   -> local_dimensions\local\plan_access_test::test_tracker_page_renders_only_a_competency_the_plan_reaches

# A plan competency (including one archived on a completed plan) must be SCOPE_PLAN.
SA_M04_plan_competency_scope_disabled             | classes/local/plan_access.php               | sa_m04_plan_competency_scope_disabled.pl
#   -> local_dimensions\local\plan_access_test::test_plan_competency_is_in_scope
#   -> local_dimensions\local\plan_access_test::test_archived_competency_of_a_completed_plan_is_in_scope
#   -> local_dimensions\local\plan_access_test::test_reach_outside_the_plan_needs_competencyview_in_the_framework_context
#   -> local_dimensions\local\plan_access_test::test_template_override_turns_the_related_link_on
#   -> local_dimensions\local\plan_access_test::test_tracker_page_renders_only_a_competency_the_plan_reaches
#   -> local_dimensions\external\competency_rule_data_scope_test::test_plan_owner_gets_the_ratings
#   -> local_dimensions\external\competency_rule_data_scope_test::test_draft_reader_without_rating_access_is_refused
#   -> local_dimensions\external\competency_rule_data_scope_test::test_competency_outside_the_scope_is_refused

# Outside the plan, competencyview/competencymanage in the competency's own framework context is
# required - dropping can_read_context() would let anyone reach any competency by id.
SA_M05_can_read_context_dropped                   | classes/local/plan_access.php               | sa_m05_can_read_context_dropped.pl
#   -> local_dimensions\local\plan_access_test::test_reach_outside_the_plan_needs_competencyview_in_the_framework_context

# A missing competency id must be refused like any other, never dereferenced.
SA_M06_missing_competency_check_dropped           | classes/local/plan_access.php               | sa_m06_missing_competency_check_dropped.pl
#   -> local_dimensions\local\plan_access_test::test_missing_competency_is_refused_like_an_unreachable_one
#   -> local_dimensions\external\competency_rule_data_scope_test::test_competency_outside_the_scope_is_refused

# A rule child is in scope only when the plan competency's rule actually has an outcome.
SA_M07_rulechild_outcome_check_dropped            | classes/local/plan_access.php               | sa_m07_rulechild_outcome_check_dropped.pl
#   -> local_dimensions\local\plan_access_test::test_rule_child_is_in_scope

# A rule child is in scope only when the plan competency has a rule type configured.
SA_M08_rulechild_ruletype_check_dropped           | classes/local/plan_access.php               | sa_m08_rulechild_ruletype_check_dropped.pl
#   -> local_dimensions\local\plan_access_test::test_rule_child_is_in_scope

# A related competency needs showrelated resolved ON for the plan's template - the first half of
# the escape hatch the owner's relayed request calls out.
SA_M09_related_needs_showrelated_dropped          | classes/local/plan_access.php               | sa_m09_related_needs_showrelated_dropped.pl
#   -> local_dimensions\local\plan_access_test::test_related_competency_needs_showrelated

# A related competency needs showrelatedlink resolved ON for the plan's template - the owner's
# rule: showrelated alone renders the pill, showrelatedlink is what additionally allows following
# it to a competency outside the plan.
SA_M10_related_needs_showrelatedlink_dropped      | classes/local/plan_access.php               | sa_m10_related_needs_showrelatedlink_dropped.pl
#   -> local_dimensions\local\plan_access_test::test_related_competency_needs_showrelatedlink
#   -> local_dimensions\local\plan_access_test::test_template_override_turns_the_related_link_on
#   -> local_dimensions\external\competency_rule_data_scope_test::test_related_competency_in_scope_is_accepted

# showrelatedlink must resolve the template custom field before falling back to the global
# setting, so a per-template override actually switches the link on/off.
SA_M11_showrelatedlink_bypasses_template_resolver | classes/local/plan_access.php               | sa_m11_showrelatedlink_bypasses_template_resolver.pl
#   -> local_dimensions\local\plan_access_test::test_template_override_turns_the_related_link_on

# The relation must reach one of the PLAN'S OWN competencies (either direction) - not just any
# competency related to the requested id. This is what keeps the escape hatch narrow: a related
# competency is only in scope because it is tied to something the plan already contains.
SA_M12_related_scope_not_limited_to_plan          | classes/local/plan_access.php               | sa_m12_related_scope_not_limited_to_plan.pl
#   -> local_dimensions\local\plan_access_test::test_competency_related_only_outside_the_plan_is_refused

# require_competency_in_scope() must throw for an out-of-scope/missing id, never return a value
# the caller could treat as a resolved scope.
SA_M13_out_of_scope_no_longer_throws              | classes/local/plan_access.php               | sa_m13_out_of_scope_no_longer_throws.pl
#   -> local_dimensions\local\plan_access_test::test_missing_competency_is_refused_like_an_unreachable_one
#   -> local_dimensions\external\competency_rule_data_scope_test::test_competency_outside_the_scope_is_refused
#   -> local_dimensions\external\competency_rule_data_scope_test::test_related_competency_in_scope_is_accepted

# Rule-data ratings require user_competency::can_read_user() on the plan owner, exactly as
# api::get_plan_competency() does - planviewdraft alone must not unlock ratings.
SA_M14_ratings_can_read_user_bypassed             | classes/external/get_competency_rule_data.php | sa_m14_ratings_can_read_user_bypassed.pl
#   -> local_dimensions\external\competency_rule_data_scope_test::test_draft_reader_without_rating_access_is_refused

# competencyid must be checked against the plan's scope before anything is read.
SA_M15_rule_data_scope_check_dropped              | classes/external/get_competency_rule_data.php | sa_m15_rule_data_scope_check_dropped.pl
#   -> local_dimensions\external\competency_rule_data_scope_test::test_competency_outside_the_scope_is_refused
#   -> local_dimensions\external\competency_rule_data_scope_test::test_related_competency_in_scope_is_accepted

# Child shortname/gradename must go out plain (accordion.js escapes once at the sink); losing the
# plain spelling here double-escapes on the client.
SA_M16_rule_data_names_lose_plain_spelling        | classes/external/get_competency_rule_data.php | sa_m16_rule_data_names_lose_plain_spelling.pl
#   -> local_dimensions\external\competency_rule_data_scope_test::test_plan_owner_gets_the_ratings
