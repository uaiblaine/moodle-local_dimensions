# G5 guards (round 1 comment audit), local_dimensions.
#   mdl mutate moodle-local_dimensions-followups "$PWD/moodle-local_dimensions-followups/mutations/followups_G5.conf" --fast
#
#     tag | file relative to the repo | perl script relative to this file
#
# Two round1-guards.json G5 entries are deliberately NOT gates here:
#  - the "AND cm.course = :courseid" outcomes-query guard in get_competency_module_links.php names
#    an EMPTY mustfail list in the source JSON ("No test goes red: the change is efficiency only");
#    including it would misreport a correct "reddened nothing" as a failure.
#  - the "existing-row check that makes a repeated add idempotent" guard (M43) in
#    add_cohort_role.php: the idempotency check lives entirely inside core's
#    tool_cohortroles\api::create_cohort_role_assignment(), not in any line this plugin owns, so no
#    mutation of a plugin file can remove it. What the plugin does own is gated instead:
#    G5_25 routes the insert around that api, so a repeat reaches the table's unique index and
#    throws, and G5_26 removes the `if ($assignment)` that keeps a repeat from logging an event.

