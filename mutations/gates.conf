# Mutation spec for the filter line (stage D1 of moodle-dev/docs/filter-line/DIMENSIONS-PLAN.md).
#   mdl mutate moodle-local_dimensions mutations/gates.conf --fast
#
# Each line breaks ONE guard of the filter line and the sweep records which tests go red: the
# line's own module (folding on its own width, the measuring class, the morph and its quiet focus
# return, Escape, matching, ranking, the suggestion's order of work, the layers under the line's
# measured bottom, the sheet, the scope's radio keys, the chips row), the two views arming it
# (their counts without the typed text, their remembered scopes under their own keys, the tracker's
# zero cell, "no results" and unknown completion), the server's state (the tracker's "To do"
# default, the remembered choice winning, both seeds carrying every key), the template's hooks
# and slot order, and the stylesheet's steps, morph and sheet.
#
# A pattern is the smallest expression of the guard, never the block around it: a pattern that
# matches nothing takes the whole sweep down at that line. Dry-match every line against the tree
# (perl -0777 -p <script> <file>, compared with the file) after any change to a file a gate names.
# Each JavaScript gate also reddens filter_line_source_test::test_the_builds_are_current, which is
# expected: the mutated source no longer matches the committed build. The source-shape tests read
# amd/src and need no rebuild. Written before any sweep: the `#   ->` lines are claims until a
# sweep log confirms them.
#
# tag | file relative to the repo | perl script relative to this directory
fl_js_observes_itself | amd/src/filter_line.js | fl_js_observes_itself.pl
#   -> local_dimensions\output\filter_line_source_test::test_the_line_measures_its_own_width
fl_js_measuring_class | amd/src/filter_line.js | fl_js_measuring_class.pl
#   -> local_dimensions\output\filter_line_source_test::test_the_line_folds_at_the_first_step_that_fits
