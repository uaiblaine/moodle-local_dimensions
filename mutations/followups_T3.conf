# T3 guards (the Rules tab's status icons and the hero's due-date calendar become masks, and every
# pix/status SVG is a single-colour currentColor mask), local_dimensions.
#   mdl mutate moodle-local_dimensions "$PWD/mutations/followups_T3.conf"
#
# The Rules tab's three child states are painted by the tokens of their meaning (success-ink with a
# surface glyph, warning-ink, neutral-ink) and keep the visually hidden label that speaks them; the
# calendar sits on the hero's branded island, so it paints in currentcolor, inherited from the
# due-date card, which carries the admin's --dimension-customtextcolor. Every tag below was applied,
# run and restored on Moodle 5.2 on 2026-09-26, and each named test went red with a PHPUnit verdict
# line.
#
#     tag | file relative to the repo | perl script relative to this file

# The icons are empty aria-hidden spans, in the markup accordion.js builds as in the templates.
