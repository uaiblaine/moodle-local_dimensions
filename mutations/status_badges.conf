# Mutation spec for the competency_status_badges hook (local_evidencehub S9, Part A) - run with
# `mdl mutate moodle-local_dimensions mutations/status_badges.conf --fast` (both --db families).
#
# Each line breaks ONE guard of the hook or of the two pages that dispatch it and names the test
# that must go red because of it. The `#   ->` lines are claims until a sweep log confirms them.
# Every pattern was dry-matched against its file and matches exactly once.
#
#     tag | file relative to the repo | perl script relative to this file

# The tone becomes a CSS class, so an unknown one must throw.
sb_a_tone_unchecked | classes/hook/competency_status_badges.php | sb_a_tone_unchecked.pl
#   -> local_dimensions\hook\competency_status_badges_test::test_an_unknown_tone_is_refused

# A listener answering from a cached list must not add a pill for an id the page does not show.
sb_b_off_page_id_kept | classes/hook/competency_status_badges.php | sb_b_off_page_id_kept.pl
#   -> local_dimensions\hook\competency_status_badges_test::test_an_id_not_on_the_page_is_ignored

# An empty label would draw an empty pill.
sb_c_empty_label_kept | classes/hook/competency_status_badges.php | sb_c_empty_label_kept.pl
#   -> local_dimensions\hook\competency_status_badges_test::test_an_empty_label_is_ignored

# The plan overview dispatches with the viewer instead of the plan's owner.
sb_d_plan_dispatch_viewer | classes/output/view_plan_summary_page.php | sb_d_plan_dispatch_viewer.pl
#   -> local_dimensions\output\view_plan_summary_page_test::test_status_badges_reach_their_own_row_and_the_hook_carries_the_owner

# The tracker dispatches with the viewer instead of the learner.
sb_e_tracker_dispatch_viewer | classes/output/view_competency_page.php | sb_e_tracker_dispatch_viewer.pl
#   -> local_dimensions\output\view_competency_page_test::test_the_hero_carries_status_badges_and_the_hook_the_learner

# The plan overview dispatches but its rows never receive the badges.
sb_f_plan_badges_dropped | classes/output/view_plan_summary_page.php | sb_f_plan_badges_dropped.pl
#   -> local_dimensions\output\view_plan_summary_page_test::test_status_badges_reach_their_own_row_and_the_hook_carries_the_owner

# The tracker dispatches but its hero never receives the badges.
sb_g_tracker_badges_dropped | classes/output/view_competency_page.php | sb_g_tracker_badges_dropped.pl
#   -> local_dimensions\output\view_competency_page_test::test_the_hero_carries_status_badges_and_the_hook_the_learner

# The plan overview hands the listener no ids, so every badge is ignored as off the page.
sb_h_plan_ids_partial | classes/output/view_plan_summary_page.php | sb_h_plan_ids_partial.pl
#   -> local_dimensions\output\view_plan_summary_page_test::test_status_badges_reach_their_own_row_and_the_hook_carries_the_owner

# The partial prints the label as HTML, so a listener could inject markup.
sb_i_label_unescaped | templates/status_badges.mustache | sb_i_label_unescaped.pl
#   -> local_dimensions\output\status_badges_template_test::test_pills_carry_their_tone_and_escape_the_label
