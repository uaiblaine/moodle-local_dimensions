# Mutation spec for the plan overview's Journey view (classes/local/plan_journey.php, its service and the switch):
#   mdl mutate moodle-local_dimensions mutations/plan_journey.conf --fast
# Sweep both --db families. Run it BEFORE the commit that adds these gates.
#
# Each line breaks ONE guard and names the test that must go red because of it. The two JavaScript gates are
# read by tests/output/plan_journey_js_source_test.php; the module's behaviour in a browser is
# tests/behat/view_plan_journey.feature, which this PHPUnit-only tool does not run. Written before any sweep:
# the `#   ->` lines are claims until a sweep log confirms them.
#
#     tag | file relative to the repo | perl script relative to this directory

# Read the plan without core's api::read_plan(), so its can_read() is never asked.
pj_plan_read | classes/local/plan_journey.php | pj_plan_read.pl
#   -> local_dimensions\local\plan_journey_test::test_the_plan_is_read_through_core_before_the_detail_rule

# Drop the overview's detail rule (user_competency::can_read_user() of the owner).
pj_detail_rule | classes/local/plan_journey.php | pj_detail_rule.pl
#   -> local_dimensions\local\plan_journey_test::test_a_viewer_without_the_detail_is_refused
#   -> local_dimensions\external\get_plan_journey_test::test_a_viewer_without_the_detail_is_refused

# Read the owner's evidence on every competency, not only the plan's.
pj_membership | classes/local/plan_journey.php | pj_membership.pl
#   -> local_dimensions\local\plan_journey_test::test_only_the_plans_competencies_appear

# Repeat the cursor's record at the top of the next page.
pj_keyset | classes/local/plan_journey.php | pj_keyset.pl
#   -> local_dimensions\local\plan_journey_test::test_paging_returns_each_record_once_across_equal_timestamps

# List a completed plan's evidence past its completion, where core's list stops.
pj_completed_bound | classes/local/plan_journey.php | pj_completed_bound.pl
#   -> local_dimensions\local\plan_journey_test::test_a_completed_plan_stops_at_its_completion_as_core_does

# Leave the folded rows in the listing's statement, so they take the page's places again.
pj_fold_listing | classes/local/plan_journey.php | pj_fold_listing.pl
#   -> local_dimensions\local\plan_journey_test::test_folded_rows_do_not_take_the_pages_places
#   -> local_dimensions\local\plan_journey_test::test_other_components_logs_fold_into_one_line_per_month

# Take a folded row on the page boundary from the wrong side: counted twice or never.
pj_fold_boundary | classes/local/plan_journey.php | pj_fold_boundary.pl
#   -> local_dimensions\local\plan_journey_test::test_a_folded_row_on_the_boundary_is_counted_once

# Drop the remainder line: rows older than the month windows are uncounted.
pj_fold_remainder | classes/local/plan_journey.php | pj_fold_remainder.pl
#   -> local_dimensions\local\plan_journey_test::test_rows_older_than_the_cap_are_still_counted

# Accept a cursor of one part, or a negative one.
pj_cursor | classes/local/plan_journey.php | pj_cursor.pl
#   -> local_dimensions\local\plan_journey_test::test_a_cursor_is_both_parts_or_none
#   -> local_dimensions\external\get_plan_journey_test::test_the_cursor_is_validated

# Answer the guest account.
pj_ws_guest | classes/external/get_plan_journey.php | pj_ws_guest.pl
#   -> local_dimensions\external\get_plan_journey_test::test_the_guest_is_refused

# Answer without the plugin's view capability.
pj_ws_capability | classes/external/get_plan_journey.php | pj_ws_capability.pl
#   -> local_dimensions\external\get_plan_journey_test::test_the_plugins_capability_is_required

# Answer while competencies are disabled (the plan read refuses too, so the scan is what sees it).
pj_ws_enabled | classes/external/get_plan_journey.php | pj_ws_enabled.pl
#   -> local_dimensions\local\external_requires_competencies_test::test_every_service_requires_competencies

# Offer the Journey to a viewer without the detail.
pj_view_candetail | classes/output/view_plan_summary_page.php | pj_view_candetail.pl
#   -> local_dimensions\output\view_plan_summary_journey_test::test_journey_is_withheld_without_the_detail

# Paint a stored Journey for a viewer it is not offered to.
pj_view_stored_without_detail | classes/output/view_plan_summary_page.php | pj_view_stored_without_detail.pl
#   -> local_dimensions\output\view_plan_summary_journey_test::test_journey_is_withheld_without_the_detail

# Trust any stored layout.
pj_view_vocabulary | classes/local/learner_view.php | pj_view_vocabulary.pl
#   -> local_dimensions\local\learner_view_test::test_an_unknown_layout_falls_back_to_the_list

# Paint an answer that is no longer the latest request's (the check after the service's await).
pj_js_latest | amd/src/plan_journey.js | pj_js_latest.pl
#   -> local_dimensions\output\plan_journey_js_source_test::test_the_latest_request_wins

# Offer the Journey's buttons whether or not the module armed.
pj_js_armed | amd/src/accordion.js | pj_js_armed.pl
#   -> local_dimensions\output\plan_journey_js_source_test::test_the_view_is_offered_only_once_armed

# Hide the list under a class written whether or not the module armed and showed its frame.
pj_js_on | amd/src/accordion.js | pj_js_on.pl
#   -> local_dimensions\output\plan_journey_js_source_test::test_the_list_is_hidden_only_after_the_journey_armed
