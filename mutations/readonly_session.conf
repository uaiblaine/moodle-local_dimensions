# Mutation spec for the read-only session of the 27 read web services - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/readonly_session.conf" --fast` on both --db
# families (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# A service declared 'readonlysession' runs without the session lock, so a $SESSION write on its
# path is silently lost. The flag must stay declared, and a write planted on the hub's path or the
# learner's must redden the session check.
#
# Run `--dry-run` first: it shows each pattern still matches the line it was written for.
#
#     tag | file relative to the repo | perl script relative to this file

# Drop one read service's flag.
RS_A_flag_dropped              | db/services.php        | rs_a_flag_dropped.pl
#   -> test_every_read_and_no_write_is_declared_read_only (tests/external/readonly_session_test.php)

# Write the session in the helper browse_structure and get_structure_node share (the hub's path).
RS_B_write_in_structure_nodes  | classes/helper.php     | rs_b_write_in_structure_nodes.pl
#   -> test_read_only_services_leave_the_session_untouched

# Write the session in the section progress behind get_course_progress (the learner's path).
RS_C_write_in_section_progress | classes/calculator.php | rs_c_write_in_section_progress.pl
#   -> test_read_only_services_leave_the_session_untouched
