# Mutation spec for the absence of an OS-preference dark block in styles.css - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/ie_osblock.conf" --fast`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
#     tag | file relative to the repo | perl script relative to this file

# A prefers-color-scheme block returns: the plugin goes dark on the OS preference alone.
IE_A_media_block_returns | styles.css | ie_a.pl
#   -> test_no_prefers_color_scheme_block
