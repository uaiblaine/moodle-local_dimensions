# Mutation spec for the accordion's course list (classes/external/get_competency_courses.php): the plan
# read and the competency scope that gate it, and the enrolment-filter cascade the scope selects. Run
# from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_courses.conf" --stack m502`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# The scope rule itself (plan_access::competency_scope()) is held by sec_scope.conf; this spec holds
# only that the web service applies it, and where.
#
#     tag | file relative to the repo | perl script relative to this file

# The scope check turned into a lookup that never throws: any competency id would list its courses
# and activities again, which was the finding.
SC_COURSES_M01_scope_check_dropped                | classes/external/get_competency_courses.php | sc_courses_m01_scope_check_dropped.pl
#   -> local_dimensions\external\competency_courses_scope_test::test_competency_outside_the_scope_is_refused
#   -> local_dimensions\external\competency_courses_scope_test::test_related_competency_answers_through_the_site_filter
#   -> local_dimensions\external\competency_courses_scope_test::test_rule_child_answers_and_its_child_is_refused

# The plan loaded without core's read check: another learner's plan would answer.
SC_COURSES_M02_plan_read_bypassed                 | classes/external/get_competency_courses.php | sc_courses_m02_plan_read_bypassed.pl
#   -> local_dimensions\external\competency_courses_scope_test::test_plan_id_zero_and_missing_plan_are_refused
#   -> local_dimensions\external\competency_courses_scope_test::test_plan_the_caller_may_not_read_is_refused_with_cores_error

# Plan id 0 skips the plan read and the scope check, the shape the service had before the fix.
SC_COURSES_M03_planid_zero_skips_the_gate         | classes/external/get_competency_courses.php | sc_courses_m03_planid_zero_skips_the_gate.pl
#   -> local_dimensions\external\competency_courses_scope_test::test_plan_id_zero_and_missing_plan_are_refused

# The plan's template applied to a related competency or a rule child, which view-competency.php
# resolves through the competency and the site only.
SC_COURSES_M04_template_cascade_outside_the_plan  | classes/external/get_competency_courses.php | sc_courses_m04_template_cascade_outside_the_plan.pl
#   -> local_dimensions\external\competency_courses_scope_test::test_related_competency_answers_through_the_site_filter
#   -> local_dimensions\external\competency_courses_scope_test::test_rule_child_answers_and_its_child_is_refused

# The plan's template never applied, even to the plan's own competency. Every scope test's control
# asks for the plan's own competency through the template, so they redden too.
SC_COURSES_M05_template_cascade_never_applies     | classes/external/get_competency_courses.php | sc_courses_m05_template_cascade_never_applies.pl
#   -> local_dimensions\external\competency_courses_scope_test::test_plan_competency_answers_through_the_plan_template
#   -> local_dimensions\external\competency_courses_scope_test::test_competency_outside_the_scope_is_refused
#   -> local_dimensions\external\competency_courses_scope_test::test_plan_id_zero_and_missing_plan_are_refused
#   -> local_dimensions\external\competency_courses_scope_test::test_plan_the_caller_may_not_read_is_refused_with_cores_error
#   -> local_dimensions\external\competency_courses_scope_test::test_related_competency_answers_through_the_site_filter
#   -> local_dimensions\external\get_competency_courses_test::test_execute_applies_plan_template_enrollmentfilter
#   -> local_dimensions\external\get_competency_courses_test::test_execute_enrolledorself_includes_self_enrolable

# A refusal to read the plan reported as a missing plan, the catch CLAUDE.md forbids (see "Reading a
# plan (plan_access)").
SC_COURSES_M06_refusal_reported_as_invalidplan    | classes/external/get_competency_courses.php | sc_courses_m06_refusal_reported_as_invalidplan.pl
#   -> local_dimensions\external\competency_courses_scope_test::test_plan_the_caller_may_not_read_is_refused_with_cores_error
