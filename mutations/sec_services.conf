# Mutation spec for group B1 - template/course visibility and enrolment-queue scope on the
# external services (competency_usage.php, get_enrol_queue_status.php). Run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_services.conf" --stack m502`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
#     tag | file relative to the repo | perl script relative to this file

# Hidden templates must be skipped unless the caller can manage them.
SB1_M01_hidden_template_guard_removed          | classes/external/competency_usage.php     | sb1_m01_hidden_template_guard_removed.pl
#   -> local_dimensions\external\competency_usage_visibility_test::test_hidden_templates_need_templatemanage_in_their_own_context

# The manager exemption must actually exempt managers, not hide the hidden template from everyone.
SB1_M02_manager_exemption_always_true          | classes/external/competency_usage.php     | sb1_m02_manager_exemption_always_true.pl
#   -> local_dimensions\external\competency_usage_visibility_test::test_hidden_templates_need_templatemanage_in_their_own_context

# The manage check must run in the template's own context, not at the site.
SB1_M02b_manage_check_moved_to_site_context    | classes/external/competency_usage.php     | sb1_m02b_manage_check_moved_to_site_context.pl
#   -> local_dimensions\external\competency_usage_visibility_test::test_hidden_templates_need_templatemanage_in_their_own_context

# Course fullname/shortname must return plain (the usage modal double-stashes them).
SB1_M03_course_names_lose_plain_spelling       | classes/external/competency_usage.php     | sb1_m03_course_names_lose_plain_spelling.pl
#   -> local_dimensions\external\competency_usage_visibility_test::test_names_are_plain_and_the_modal_escapes_them_once

# Activity name must return plain.
SB1_M04_activity_name_lose_plain_spelling      | classes/external/competency_usage.php     | sb1_m04_activity_name_lose_plain_spelling.pl
#   -> local_dimensions\external\competency_usage_visibility_test::test_names_are_plain_and_the_modal_escapes_them_once

# Template name must return plain.
SB1_M05_template_name_lose_plain_spelling      | classes/external/competency_usage.php     | sb1_m05_template_name_lose_plain_spelling.pl
#   -> local_dimensions\external\competency_usage_visibility_test::test_names_are_plain_and_the_modal_escapes_them_once

# A cohort must actually be attached to the template before its enrolment queue is polled.
SB1_M06_cohort_link_check_dropped              | classes/external/get_enrol_queue_status.php | sb1_m06_cohort_link_check_dropped.pl
#   -> local_dimensions\external\enrol_queue_status_scope_test::test_a_cohort_not_linked_to_the_template_is_refused

# Tracked ids must be narrowed to courses linked to the template.
SB1_M07_candidates_not_narrowed_to_linked_courses | classes/external/get_enrol_queue_status.php | sb1_m07_candidates_not_narrowed_to_linked_courses.pl
#   -> local_dimensions\external\enrol_queue_status_scope_test::test_items_cover_only_linked_courses_the_caller_may_configure

# Tracked ids must be narrowed to courses the caller may configure.
SB1_M08_tracked_not_narrowed_to_allowed        | classes/external/get_enrol_queue_status.php | sb1_m08_tracked_not_narrowed_to_allowed.pl
#   -> local_dimensions\external\enrol_queue_status_scope_test::test_items_cover_only_linked_courses_the_caller_may_configure

# The pending list must be narrowed to courses the caller may configure too.
SB1_M09_pending_not_narrowed_to_allowed        | classes/external/get_enrol_queue_status.php | sb1_m09_pending_not_narrowed_to_allowed.pl
#   -> local_dimensions\external\enrol_queue_status_scope_test::test_pending_covers_only_courses_the_caller_may_configure
