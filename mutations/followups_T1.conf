# T1 guards (the competency tracker describes the plan owner: view-competency.php, the two card
# web services and their shared plan gate), local_dimensions.
#   mdl mutate moodle-local_dimensions "$PWD/mutations/followups_T1.conf"
#
# With a plan, the tracker's cards describe its owner as the plan accordion's do (R3_20a..h), while
# the lock and what a locked card offers stay the viewer's; without one, and on the learner's own
# plan, nothing changes. Every tag below was applied, run and restored on Moodle 5.2 on 2026-09-26,
# and each named test went red with a PHPUnit verdict line.
#
#     tag | file relative to the repo | perl script relative to this file

# calculator::get_course_section_progress() describes the owner: modinfo, completion, the workload
# predicate, the enrolment guard of the activity loop and the card shape are all the owner's.

