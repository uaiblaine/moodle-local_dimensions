# Mutation spec for the second security-audit hardening group (CSV import rule class, category
# "Delete all" atomicity and rights). Run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_audit_g2.conf" --stack m503b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard and names the test that must go red because of it. Run `--dry-run`
# first: it shows each pattern still matches the line it was written for.
#
#     tag | file relative to the repo | perl script relative to this file

# Call migrate_config() on any existing class the CSV names.
SAG2_A_ruletype_unchecked   | classes/local/framework_csv_importer.php | sag2_ruletype_unchecked.pl
#   -> test_a_ruletype_that_is_not_a_competency_rule_is_not_called

# Let the refusal on the framework escape without rolling the deletion back.
SAG2_B_no_rollback          | classes/local/category_lifecycle.php | sag2_no_rollback.pl
#   -> test_a_failed_delete_does_not_leave_the_templates_gone

# Offer "Delete all" to someone who may not manage the templates.
SAG2_C_templates_unchecked  | classes/local/category_lifecycle.php | sag2_templates_unchecked.pl
#   -> test_delete_all_is_not_offered_without_the_right_to_manage_every_object

# Offer "Delete all" to someone who may not manage the frameworks.
SAG2_D_frameworks_unchecked | classes/local/category_lifecycle.php | sag2_frameworks_unchecked.pl
#   -> test_delete_all_is_not_offered_without_the_right_to_manage_every_object

# Provision the custom fields for a caller who may not import.
SAG2_E_capability_unchecked | classes/local/framework_csv_importer.php | sag2_capability_unchecked.pl
#   -> test_a_caller_without_the_capability_provisions_nothing
