# Mutation spec for the connectivity shapes of isNetworkError() in the hub's error routing - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/network_error_shapes.conf" --fast`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard in amd/src/central/errors.js and names the test that must go red. The test reads the
# source, so no gate needs the JavaScript to be rebuilt.
#
#     tag | file relative to the repo | perl script relative to this file

# Stop recognising a timeout (AbortError): it would reach the exception dialogue.
NE_A_abort | amd/src/central/errors.js | ne_a_abort.pl
#   -> test_only_a_transport_failure_counts_as_a_network_error

# Stop recognising a non-2xx answer (Error HTTP n): a balancer's 502 or 504 would reach the dialogue.
NE_B_http | amd/src/central/errors.js | ne_b_http.pl
#   -> test_only_a_transport_failure_counts_as_a_network_error

# Stop recognising fetch's TypeError: a dropped connection would reach the dialogue.
NE_C_fetch | amd/src/central/errors.js | ne_c_fetch.pl
#   -> test_only_a_transport_failure_counts_as_a_network_error

# Drop the errorcode exclusion: a web-service exception named AbortError or HTTP would read as a lost connection.
NE_D_errorcode | amd/src/central/errors.js | ne_d_errorcode.pl
#   -> test_only_a_transport_failure_counts_as_a_network_error
