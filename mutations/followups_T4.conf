# T4 guards (the paperclip beside prior-learning evidence whose record holds files), local_dimensions.
#   mdl mutate moodle-local_dimensions "$PWD/mutations/followups_T4.conf"
#
# get_user_competency_summary_in_plan sets hasfiles on each evidence_evidenceofpriorlearninglinked row:
# the row's URL is matched exactly against the owner's records linked to the competency today, their
# files are counted in the owner's user context without the directory entry, and the key is set only
# for a viewer who passes user_evidence::can_read_user() on the owner. The accordion draws the marker
# on a strict true only, named by evidence_hasfiles. Applied, run and restored on Moodle 5.2 on
# 2026-09-27; every entry below turned its named tests red with a PHPUnit verdict line and was
# restored byte-identical.
#
#     tag | file relative to the repo | perl script relative to this file

