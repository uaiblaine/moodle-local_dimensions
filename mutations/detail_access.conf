# Mutation spec for withholding competency detail - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/detail_access.conf" --stack m502b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard and names the test that must go red because of it. The grid-mode
# half - openDetailModal() bailing out when a row has no detail region - is JavaScript and is held
# by the @javascript scenario in tests/behat/view_plan_detail_access.feature instead, which this
# PHPUnit-only tool cannot run.
#
# Run `--dry-run` first: it shows each pattern still matches the line it was written for.
#
#     tag | file relative to the repo | perl script relative to this file

# Offer the detail to everyone, which is the defect this change fixes.
DA_A_flag_always_true   | classes/output/view_plan_summary_page.php | da_a_flag_always_true.pl
#   -> test_draft_reader_gets_the_list_without_detail
#   -> test_the_template_withholds_the_detail_controls

# Withhold the detail from everyone, the over-correction the control exists to catch.
DA_B_flag_always_false  | classes/output/view_plan_summary_page.php | da_b_flag_always_false.pl
#   -> test_viewers_who_can_read_user_competencies_keep_the_detail
#   -> test_the_template_withholds_the_detail_controls

# Render the detail region whatever the flag says. The section is swapped for one that is always
# true inside the loop rather than deleted, so the template still compiles and the test goes red
# for the region, not for a syntax error.
DA_C_region_unguarded   | templates/view_plan_summary.mustache | da_c_region_unguarded.pl
#   -> test_the_template_withholds_the_detail_controls
