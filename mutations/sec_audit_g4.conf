# Mutation spec for the report builder fixes of security audit group 4 - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_audit_g4.conf" --stack m503b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard and names the tests that must go red because of it. The description
# context of plan.php, template.php and user_evidence.php has no mutation: core's format_text()
# output does not differ for these inputs, so no test can tell the context from its absence.
#
# Run `--dry-run` first: it shows each pattern still matches the line it was written for.
#
#     tag | file relative to the repo | perl script relative to this file

# The template branch of the derived table also lists a completed plan: its template's current
# competencies appear beside the archived ones (the defect this change fixes).
SAG4_A_template_branch_unrestricted | classes/reportbuilder/datasource/learning_plan_competencies.php | sag4_a_template_branch_unrestricted.pl
#   -> test_completed_template_plan_lists_the_archived_competencies

# The archive branch returns nothing: a completed plan loses its competencies.
SAG4_B_archive_branch_empty | classes/reportbuilder/datasource/learning_plan_competencies.php | sag4_b_archive_branch_empty.pl
#   -> test_completed_template_plan_lists_the_archived_competencies
#   -> test_content

# The plan's own competencies are listed for a completed plan too: Gamma appears from both the
# plan row and the archive.
SAG4_C_plancomp_branch_unrestricted | classes/reportbuilder/datasource/learning_plan_competencies.php | sag4_c_plancomp_branch_unrestricted.pl
#   -> test_content

# The template branch lists only completed plans, the over-correction the control exists to catch.
SAG4_D_template_branch_completed_only | classes/reportbuilder/datasource/learning_plan_competencies.php | sag4_d_template_branch_completed_only.pl
#   -> test_completed_template_plan_lists_the_archived_competencies
#   -> test_active_template_plan_follows_the_current_template

# The link text is printed unescaped.
SAG4_F_link_text_unescaped | templates/reportbuilder_link.mustache | sag4_f_page_link_unescaped.pl
#   -> test_page_link_escapes_once

# A stored URL reaches the href without being cleaned.
SAG4_G_stored_url_uncleaned | classes/reportbuilder/local/helpers/link.php | sag4_g_stored_url_uncleaned.pl
#   -> test_stored_url
#   -> test_stored_url_links_only_a_web_address

# The evidence URL column goes back to a link around whatever is stored.
SAG4_H_evidence_url_uncleaned | classes/reportbuilder/local/entities/evidence.php | sag4_h_evidence_url_uncleaned.pl
#   -> test_stored_url_links_only_a_web_address

# The evidence-of-prior-learning URL column goes back to a link around whatever is stored.
SAG4_I_user_evidence_url_uncleaned | classes/reportbuilder/local/entities/user_evidence.php | sag4_i_user_evidence_url_uncleaned.pl
#   -> test_stored_url_links_only_a_web_address
