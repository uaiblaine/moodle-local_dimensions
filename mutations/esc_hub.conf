# Mutation spec for group C1 - plain-spelling / single-escape discipline on the central hub
# (manager-facing tabs, external services and AMD datasources/modals). Run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/esc_hub.conf" --stack m502`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Every guard here protects the same contract: a name/path travels the server -> WS -> AMD chain
# in its PLAIN spelling and is escaped exactly once, at the point it is written into HTML (a
# double stash, textContent, or escapeHtml()/decodeEntities() in AMD). Removing a plain-spelling
# site either double-escapes (server escapes, then the sink escapes again) or, for the JS-side
# sink guards, unescapes (the sink stops escaping a value that IS plain, opening stored/reflected
# XSS through a competency/course/cohort/role/template name).
#
#     tag | file relative to the repo | perl script relative to this file

