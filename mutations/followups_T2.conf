# T2 guards (the accordion's course list asks the owner gate; the Structure footer's rule button), local_dimensions.
#   mdl mutate moodle-local_dimensions "$PWD/mutations/followups_T2.conf"
#
# get_competency_courses describes the plan owner (R3_20a..h), so a viewer must also be allowed to
# read the owner's user competencies: read_plan() accepts planviewdraft alone on a draft plan. The
# accordion never asks for that viewer, but the service is callable directly. Applied, run and
# restored on Moodle 5.2 on 2026-09-26; every entry below turned its named tests red with a PHPUnit
# verdict line and was restored byte-identical.
#
#     tag | file relative to the repo | perl script relative to this file

