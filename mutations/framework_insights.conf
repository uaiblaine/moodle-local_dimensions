# Mutation spec for the framework insights web service (Competency hub, lenses and checker): who may
# ask, what each viewer is told about usage, the SQL, the rules, the checks and the contrast ratio.
#   mdl mutate moodle-local_dimensions "$PWD/mutations/framework_insights.conf" --fast --branch MOODLE_503_STABLE --db pgsql
#   mdl mutate moodle-local_dimensions "$PWD/mutations/framework_insights.conf" --fast --branch MOODLE_503_STABLE --db mariadb
# Sweep BOTH database families. The `fi_` gates break classes/external/get_framework_insights.php, the
# `fc_` ones classes/local/contrast_ratio.php. Every pattern matches once in its file; the SQL ones
# carry the neighbouring line because `WHERE c.competencyframeworkid = :fw` and the c1/c2 forms
# repeat. A "framework join" gate widens the condition to `OR 1 = 1` (the placeholder stays used) and
# is held by test_usage_leaves_out_another_framework (a competency of a second framework with every
# kind of use) or, for the relations query, by the two rows that leave the framework from either end.
# Core never writes such a row (related_competency refuses a pair from two frameworks), so that test
# writes them with insert_record(), as a direct write or a repaired database would leave them.
# Known equivalent mutants, deliberately without a gate: the SQL's DISTINCT and UNION (a plan is held
# by one competency once per arm); the `$rule['type'] === 'points'` half of the cannot-fire check; the
# framework join of the colours query (colours of other frameworks are never read); the
# `is_array($config['base'])` half of the points rule's well-formed test; the json_validate() guard
# (json_decode() returns null on its own); missing_framework()'s table name; and either half of the
# unset-colour guard alone (the gate fi_colour_unset_pair_measured drops both).
# Also equivalent for every row core writes: the pairs' dedup key (core stores one row per pair) and
# taking a row's stored order instead of min()/max() (related_competency stores the lower id first);
# fi_relations_pair_order swaps both ends instead, which a stored row cannot hide.
# The two withheld-category gates need local_unlistedcourses in the runner (the test skips without).
# Written before any sweep: the `#   ->` lines are claims until a sweep log confirms them.
#
#     tag | file relative to the repo | perl script relative to this file

