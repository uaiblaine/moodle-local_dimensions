# Mutation spec for the per-course catch of get_courses_completion_status - run from the repo with
# `mdl mutate moodle-local_dimensions-405 "$PWD/mutations/ia_completion_throwable.conf" --stack m405`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
#     tag | file relative to the repo | perl script relative to this file

# The catch narrows back to \Exception: a TypeError in one course fails the whole response.
IA_A_catch_exception_only | classes/external/get_courses_completion_status.php | ia_a.pl
#   -> test_an_error_in_one_course_leaves_the_others_answered
