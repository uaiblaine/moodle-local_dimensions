# Mutation spec for the learner view events - run with
# `mdl mutate moodle-local_dimensions mutations/view_events.conf --stack m502b`.
#
# Each line breaks ONE guard in classes/local/view_events.php and names the test that must go
# red because of it. The page calls (view-plan.php, view-competency.php) and the accordion's
# logCompetencyView() are held by tests/behat/view_plan_logging.feature instead, which this
# PHPUnit-only tool cannot run.
#
# Run `--dry-run` first: it shows each pattern still matches the line it was written for.
#
#     tag | file relative to the repo | perl script relative to this file

# A viewer holding only the draft capabilities reads a draft plan, but get_plan_competency()
# refuses them; without the guard the tracker page throws for that viewer.
VE_A_draft_reader_guard  | classes/local/view_events.php | ve_a_draft_reader_guard.pl
#   -> test_viewer_who_cannot_read_user_competencies_is_skipped

# A related competency outside the plan reaches the tracker; without the guard
# plan::get_competency() throws.
VE_B_outside_plan_guard  | classes/local/view_events.php | ve_b_outside_plan_guard.pl
#   -> test_competency_outside_the_plan_is_skipped

# Never take the completed-plan branch: core refuses user_competency_viewed_in_plan there.
VE_C_completed_branch    | classes/local/view_events.php | ve_c_completed_branch.pl
#   -> test_competency_in_a_completed_plan_logs_user_competency_plan_viewed

# The plan overview's own event, silenced.
VE_D_plan_viewed_silent  | classes/local/view_events.php | ve_d_plan_viewed_silent.pl
#   -> test_plan_viewed_logs_the_core_plan_event
