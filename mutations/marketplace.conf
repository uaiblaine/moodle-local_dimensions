# Mutation spec for the plugins directory readiness gates (tests/marketplace_readiness_test.php)
# and the two behaviour guards added with them: built-in images deleted with their competency or
# template, and the hub's user search honouring hiddenuserfields.
#   mdl mutate moodle-local_dimensions "$PWD/mutations/marketplace.conf" --fast --db pgsql
#   mdl mutate moodle-local_dimensions "$PWD/mutations/marketplace.conf" --fast --db mariadb
#
# Each line breaks ONE rule and names the tests that must go red. Swept on 2026-10-22 with
# --fast on pgsql and MariaDB: all 13 mutations reddened every test they name.
#
# tag | file relative to the repo | perl script relative to this directory

# The licence file loses its text.
mk_licence_emptied | LICENSE | mk_licence_emptied.pl
#   -> local_dimensions\marketplace_readiness_test::test_the_package_carries_a_licence_file

# The Brazilian Portuguese strings ship in the zip again.
mk_pt_br_ships | .gitattributes | mk_pt_br_ships.pl
#   -> local_dimensions\marketplace_readiness_test::test_only_english_strings_ship

# A lang file computes a string instead of holding it.
mk_lang_concatenation | lang/en/local_dimensions.php | mk_lang_concatenation.pl
#   -> local_dimensions\marketplace_readiness_test::test_lang_files_are_data_only

# The README stops naming a capability.
mk_readme_capability | README.md | mk_readme_capability.pl
#   -> local_dimensions\marketplace_readiness_test::test_the_readme_names_tables_capabilities_and_dependencies

# A setting is stored in the main config table.
mk_setting_unprefixed | settings.php | mk_setting_unprefixed.pl
#   -> local_dimensions\marketplace_readiness_test::test_settings_are_stored_per_plugin

# A root token rule also paints: the custom-property exemption must not cover it.
mk_root_rule_paints | styles.css | mk_root_rule_paints.pl
#   -> local_dimensions\marketplace_readiness_test::test_styles_are_namespaced

# A theme sheet restyles a core element: the theme sheets are read too.
mk_theme_sheet_unscoped | styles_boost.css | mk_theme_sheet_unscoped.pl
#   -> local_dimensions\marketplace_readiness_test::test_styles_are_namespaced

# A shipped source file loses its copyright line.
mk_copyright_dropped | lib.php | mk_copyright_dropped.pl
#   -> local_dimensions\marketplace_readiness_test::test_source_files_carry_the_boilerplate

# The plugin starts stamping group memberships with its component, outside the provider.
mk_stamped_membership | lib.php | mk_stamped_membership.pl
#   -> local_dimensions\marketplace_readiness_test::test_stamped_core_rows_are_covered_by_the_provider

# A deleted competency keeps its images.
mk_competency_images_kept | classes/observer.php | mk_competency_images_kept.pl
#   -> local_dimensions\observer_test::test_competency_deleted_removes_its_images_only

# A deleted template keeps its images.
mk_template_images_kept | classes/observer.php | mk_template_images_kept.pl
#   -> local_dimensions\observer_test::test_template_deleted_removes_its_images_only

# The sweep deletes the images of every instance, not only the deleted one's.
mk_images_of_every_instance | classes/picture_manager.php | mk_images_of_every_instance.pl
#   -> local_dimensions\observer_test::test_competency_deleted_removes_its_images_only
#   -> local_dimensions\observer_test::test_template_deleted_removes_its_images_only

# The user search keeps the viewuseridentity gate but ignores hiddenuserfields.
mk_hidden_fields_ignored | classes/external/search_assignable_users.php | mk_hidden_fields_ignored.pl
#   -> local_dimensions\external\assignable_users_test::test_a_hidden_user_field_needs_viewhiddendetails
