# Mutation spec for the competency_panel_sections hook and its read path (Competency hub v2, S7) - run with
# `mdl mutate moodle-local_dimensions mutations/competency_panel_sections.conf --fast` (both --db families).
#
# Each line breaks ONE guard or sanitising rule of the hook, of local_dimensions_get_competency_panel_sections or
# of the page's flag, and names the test that must go red because of it. The `#   ->` lines are claims until a
# sweep log confirms them. Each script changes exactly one place and leaves a file that passes php -l.
# The string-shape test of local_url() (absolute under wwwroot or root-relative, never //host) has no gate: today
# PARAM_LOCALURL also refuses every address it refuses, so deleting it reddens nothing; it states the rule.
#
#     tag | file relative to the repo | perl script relative to this file

# A name that is not an installed component would prefix a key and claim a section, with no debugging message.
cps_a_component_unchecked | classes/hook/competency_panel_sections.php | cps_a_component_unchecked.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_a_name_that_is_not_a_component_is_refused

# A malformed key would reach the data-key attribute and the heading id, with no debugging message.
cps_b_key_unchecked | classes/hook/competency_panel_sections.php | cps_b_key_unchecked.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_a_malformed_key_is_refused

# A later section under a taken key would be kept beside the first, with no debugging message.
cps_c_duplicate_kept | classes/hook/competency_panel_sections.php | cps_c_duplicate_kept.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_one_component_cannot_add_two_sections_with_one_key

# The tone becomes a CSS class, so an unknown one is dropped with a debugging message and its row kept.
cps_d_tone_unchecked | classes/hook/competency_panel_sections.php | cps_d_tone_unchecked.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_an_unknown_tone_is_refused

# Listeners could add any number of sections.
cps_e_sections_unbounded | classes/hook/competency_panel_sections.php | cps_e_sections_unbounded.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_sections_beyond_the_bound_are_dropped

# A section could carry any number of rows.
cps_f_rows_unbounded | classes/hook/competency_panel_sections.php | cps_f_rows_unbounded.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_rows_beyond_the_bound_are_dropped

# An escaped tag would survive as an entity, and an escaped text would show its entities.
cps_g_entities_kept | classes/hook/competency_panel_sections.php | cps_g_entities_kept.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_markup_never_survives
#   -> local_dimensions\hook\competency_panel_sections_test::test_text_is_plain_whatever_formatstringstriptags_says

# PARAM_TEXT keeps a multilang span, so only strip_tags() makes the text plain.
cps_h_tags_kept | classes/hook/competency_panel_sections.php | cps_h_tags_kept.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_markup_never_survives

# A text could be of any length.
cps_i_length_unbounded | classes/hook/competency_panel_sections.php | cps_i_length_unbounded.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_texts_are_cut_to_their_bound

# PARAM_LOCALURL admits a relative address, so a relative moodle_url would be kept.
cps_j_link_locality_unchecked | classes/hook/competency_panel_sections.php | cps_j_link_locality_unchecked.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_a_link_object_is_local_or_dropped

# A moodle_url repairs a protocol-relative address into a path of this site; PARAM_LOCALURL drops it.
cps_k_link_localurl_unchecked | classes/hook/competency_panel_sections.php | cps_k_link_localurl_unchecked.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_a_link_object_is_local_or_dropped

# A link without a label would be drawn as an empty anchor.
cps_l_link_without_label | classes/hook/competency_panel_sections.php | cps_l_link_without_label.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_a_link_without_a_label_is_dropped

# Without validate_context() a visitor not logged in who calls the service directly (the AJAX door refuses it first,
# servicerequireslogin) reaches the capability check instead of the login refusal.
cps_m_ws_context_unvalidated | classes/external/get_competency_panel_sections.php | cps_m_ws_context_unvalidated.pl
#   -> local_dimensions\external\get_competency_panel_sections_test::test_not_logged_in_is_refused

# A guest whose role may read competencies would get the sections.
cps_n_ws_guest_admitted | classes/external/get_competency_panel_sections.php | cps_n_ws_guest_admitted.pl
#   -> local_dimensions\external\get_competency_panel_sections_test::test_a_guest_is_refused_even_with_the_read_right

# A user who may not read competencies in the framework's category would get its sections.
cps_o_ws_read_unchecked | classes/external/get_competency_panel_sections.php | cps_o_ws_read_unchecked.pl
#   -> local_dimensions\external\get_competency_panel_sections_test::test_no_read_right_in_the_framework_context_is_refused

# With competencies disabled the listeners would still run.
cps_p_ws_enabled_unchecked | classes/external/get_competency_panel_sections.php | cps_p_ws_enabled_unchecked.pl
#   -> local_dimensions\external\get_competency_panel_sections_test::test_disabled_competencies_are_refused

# The service answers without asking the listeners.
cps_q_ws_not_dispatched | classes/external/get_competency_panel_sections.php | cps_q_ws_not_dispatched.pl
#   -> local_dimensions\external\get_competency_panel_sections_test::test_the_listener_sections_arrive_in_order

# Every reader would be told they manage the framework.
cps_r_ws_manage_always | classes/external/get_competency_panel_sections.php | cps_r_ws_manage_always.pl
#   -> local_dimensions\external\get_competency_panel_sections_test::test_a_reader_is_not_told_they_manage

# A site without a companion would ask for sections on every selection.
cps_s_props_always_listening | classes/output/hub_map.php | cps_s_props_always_listening.pl
#   -> local_dimensions\output\hub_map_test::test_the_props_say_whether_a_plugin_adds_panel_sections

# Zero-width and bidirectional controls would stay in a text: a right-to-left override would reorder a title.
cps_t_invisible_kept | classes/hook/competency_panel_sections.php | cps_t_invisible_kept.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_invisible_text_is_empty

# A text of format characters alone (soft hyphens) would pass as a title: an invisible heading.
cps_u_visibility_unchecked | classes/hook/competency_panel_sections.php | cps_u_visibility_unchecked.pl
#   -> local_dimensions\hook\competency_panel_sections_test::test_invisible_text_is_empty
