# Content handling of the framework CSV import (scale items, site-scale creation), the report builder text
# columns, the observer's custom field save and the template import analyser's read checks (MDL Shield review
# of 2026-10-18, findings 1, 3, 6 and 8).
#   mdl mutate moodle-local_dimensions-502 "$PWD/mutations/mdlshield_content.conf" --fast --branch MOODLE_502_STABLE --db pgsql
#   mdl mutate moodle-local_dimensions-502 "$PWD/mutations/mdlshield_content.conf" --fast --branch MOODLE_502_STABLE --db mariadb
#
# c3 reddens on pgsql only, and that is its point: there advanced_testcase holds a transaction around the
# test, so import()'s nested rollback cannot undo the framework row, the case the up-front check exists for
# (a caller with its own transaction). On MariaDB no outer transaction exists and the rollback alone holds.
#
#     tag | file relative to the repo | perl script relative to this file

c1_scale_items_cleaned | classes/local/framework_csv_serializer.php | mdc_scale_clean.pl
#   -> test_scale_items_are_cleaned_on_parse
c2_managescales_check | classes/local/framework_csv_importer.php | mdc_managescales.pl
#   -> test_a_category_manager_cannot_create_a_global_scale
c3_scales_checked_up_front | classes/local/framework_csv_importer.php | mdc_up_front.pl
#   -> test_a_category_manager_cannot_create_a_global_scale
c4_empty_scale_refused | classes/local/framework_csv_importer.php | mdc_empty_scale.pl
