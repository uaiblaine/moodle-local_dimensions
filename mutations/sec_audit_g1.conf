# Mutation spec for the security-audit group 1 hardening - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_audit_g1.conf" --stack m503b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard and names the test that must go red because of it. Run `--dry-run`
# first: it shows each pattern still matches the line it was written for.
#
#     tag | file relative to the repo | perl script relative to this file

# Competency modal: the posted framework is no longer compared with the competency's own.
SAG1_A_form_mismatch_ignored | classes/form/competency_dynamic_form.php | sag1_form_mismatch_ignored.pl
#   -> test_foreign_competency_with_own_framework_is_refused

# Competency modal: the context comes from the posted framework only, as before the fix.
SAG1_B_form_posted_framework_only | classes/form/competency_dynamic_form.php | sag1_form_posted_framework_only.pl
#   -> test_foreign_competency_with_own_framework_is_refused

