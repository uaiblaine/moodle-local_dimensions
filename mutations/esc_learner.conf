# Mutation spec for group C2 - plain-spelling / single-escape discipline on the learner-facing
# surfaces (course-progress and rule-child web services, the tracker/plan-overview renderers, chip
# filters, and the accordion.js reader). Run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/esc_learner.conf" --stack m502`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Same contract as esc_hub.conf: a name/label travels PLAIN from PHP through the WS boundary and
# is escaped exactly once at the AMD sink. Two guards here (M8/M8b) are the injection-guard pair
# for view_competency_page.php's course card, which needs BOTH the plain aria-label spelling and
# the escaped fullname spelling from the SAME source value - losing either one is a distinct bug
# (a raw name in a triple-stash sink, or a double-escaped aria-label).
#
#     tag | file relative to the repo | perl script relative to this file

