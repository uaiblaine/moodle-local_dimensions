# Mutation spec for the hidden-section agreement between the card shape resolver and the progress
# walk - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/section_visibility.conf" --stack m502b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard and names the tests that must go red. The guards are chained: a module in
# a hidden section is filtered out by more than one of them, so removing one alone can leave
# test_hidden_section_activity_is_invisible_to_both_paths green while a combined mutation reddens it.
#
#     tag | file relative to the repo | perl script relative to this file

# The activity visibility filter in counts_towards_progress().
SV_A_cm_visibility_filter    | classes/calculator.php                 | sv_a_cm_visibility_filter.pl
#   -> calculator_course_percentage_test::test_a_hidden_activity_is_not_counted
#   -> calculator_visibility_test (four tests)

# The uservisible check resolve_card_shape() applies before naming the single tracked activity.
SV_B_shape_uservisible       | classes/calculator.php                 | sv_b_shape_uservisible.pl
#   -> test_a_course_of_one_unopened_activity_is_not_an_activity_card

# Both resolver filters at once: the hidden activity can be named on the card.
SV_C_resolver_filters        | classes/calculator.php                 | sv_c_resolver_filters.pl
#   -> test_hidden_section_activity_is_invisible_to_both_paths, plus the SV_A and SV_B tests

# The progress walk's hidden-section and hidden-entirely skips: the hidden section is listed.
SV_D_walk_section_filters    | classes/calculator.php                 | sv_d_walk_section_filters.pl
#   -> test_hidden_section_activity_is_invisible_to_both_paths

# The walk's section skips and the activity filter at once: the hidden section counts its activity.
SV_F_walk_filters            | classes/calculator.php                 | sv_f_walk_filters.pl
#   -> test_hidden_section_activity_is_invisible_to_both_paths, plus the SV_A tests

# The fixture no longer hides the section, so the test's precondition must fail.
SV_E_fixture_not_hidden      | tests/calculator_card_shape_test.php   | sv_e_fixture_not_hidden.pl
#   -> test_hidden_section_activity_is_invisible_to_both_paths
