# The bulk appearance service of the competency workspace (hub v2, stage S6): one gate per guard of
# classes/external/set_competencies_appearance.php.
#   mdl mutate moodle-local_dimensions "$PWD/mutations/set_competencies_appearance.conf" --fast --branch MOODLE_503_STABLE --db pgsql
#   mdl mutate moodle-local_dimensions "$PWD/mutations/set_competencies_appearance.conf" --fast --branch MOODLE_503_STABLE --db mariadb
#
# Not gated, and why: the login refusal is the door's (call_external_function refuses a visitor before
# execute() runs; validate_context() repeats it), and the handler's can_edit() check in require_writable()
# equals the capability check for every appearance field today (it exists for a field whose can_edit()
# differs, as the custom SCSS one does), so deleting either reddens nothing by construction.
#
#     tag | file relative to the repo | perl script relative to this file

