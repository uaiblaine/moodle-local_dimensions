# Mutation spec for the plan overview's address-opened competency and its actions row:
#   mdl mutate moodle-local_dimensions mutations/plan_overview_actions.conf --fast
# Sweep both --db families. Run it BEFORE the commit that adds these gates.
#
# Each line breaks ONE guard and names the test that must go red because of it. The client half
# (core's two services, the pending guard, the reload, the open-on-load) is held by
# tests/output/plan_actions_js_source_test.php and the scenarios of
# tests/behat/view_plan_actions.feature, which this PHPUnit-only tool does not run. Written before any
# sweep: the `#   ->` lines are claims until a sweep log confirms them.
#
#     tag | file relative to the repo | perl script relative to this directory

# Hand over any positive id, listed or not.
po_open_membership | classes/output/view_plan_summary_page.php | po_open_membership.pl
#   -> local_dimensions\output\view_plan_summary_actions_test::test_an_id_outside_the_plan_is_ignored_silently

# Hand the id over to a viewer who gets no detail.
po_open_candetail | classes/output/view_plan_summary_page.php | po_open_candetail.pl
#   -> local_dimensions\output\view_plan_summary_actions_test::test_the_id_is_handed_over_only_with_detail

# Offer the review actions on a plan based on a template.
po_review_template | classes/local/plan_access.php | po_review_template.pl
#   -> local_dimensions\output\view_plan_summary_actions_test::test_the_review_flags_are_the_core_exporters

# Offer the review actions to a viewer core refuses them.
po_review_capability | classes/local/plan_access.php | po_review_capability.pl
#   -> local_dimensions\output\view_plan_summary_actions_test::test_the_review_flags_are_the_core_exporters

# Offer "Request review" whatever the status.
po_request_status | classes/local/plan_access.php | po_request_status.pl
#   -> local_dimensions\output\view_plan_summary_actions_test::test_the_review_flags_are_the_core_exporters
#   -> local_dimensions\output\view_plan_summary_actions_test::test_a_plan_out_of_draft_has_no_status_and_no_action

# Offer "Cancel review request" whatever the status.
po_cancel_status | classes/local/plan_access.php | po_cancel_status.pl
#   -> local_dimensions\output\view_plan_summary_actions_test::test_the_review_flags_are_the_core_exporters
#   -> local_dimensions\output\view_plan_summary_actions_test::test_a_plan_out_of_draft_has_no_status_and_no_action

# Name the link "Manage plan" for every viewer.
po_link_label | classes/output/view_plan_summary_page.php | po_link_label.pl
#   -> local_dimensions\output\view_plan_summary_actions_test::test_the_link_label_follows_can_manage

# Show the hidden row by pressing the "All" cell, whose handler saves the reader's view.
po_reveal_saves | amd/src/accordion.js | po_reveal_saves.pl
#   -> local_dimensions\output\plan_actions_js_source_test::test_a_hidden_row_is_shown_without_saving_the_view
