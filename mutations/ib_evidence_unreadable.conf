# Mutation spec for the unreadable-framework memo of the template CSV export and the file-count
# subquery of the prior learning entity - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/ib_evidence_unreadable.conf" --stack m503`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
#     tag | file relative to the repo | perl script relative to this file

# The refusal is never recorded: every competency of an unreadable framework re-reads it.
IB_A_refusal_not_memoised | classes/local/template_csv_serializer.php | ib_a.pl
#   -> test_unreadable_framework_is_withheld_and_checked_once

# The file count ignores the owner: files of every user context with the same item id are counted.
IB_B_files_any_owner | classes/reportbuilder/local/entities/user_evidence.php | ib_b.pl
#   -> test_files_in_another_context_are_not_counted
