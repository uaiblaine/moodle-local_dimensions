# Mutation spec for reading a plan on the learner pages - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/plan_access.conf" --stack m502b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard in classes/local/plan_access.php and names the tests that must go red.
#
#     tag | file relative to the repo | perl script relative to this file

# Widen the catch back to every exception, which was the defect: a learner's own draft plan and
# disabled competencies would both read as an invalid plan again.
PA_A_catch_everything | classes/local/plan_access.php | pa_a_catch_everything.pl
#   -> test_owner_refused_a_draft_plan_gets_the_permission_error
#   -> test_disabled_competencies_surface_as_core_error

# Catch nothing: a missing plan would surface as a raw database error.
PA_B_catch_nothing    | classes/local/plan_access.php | pa_b_catch_nothing.pl
#   -> test_missing_plan_is_invalid
#   -> test_ids_below_one_are_invalid
