# Mutation spec for the security audit batch G3 - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/sec_audit_g3.conf" --stack m503b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard and names the test that must go red because of it. Run `--dry-run`
# first: it shows each pattern still matches the line it was written for.
#
#     tag | file relative to the repo | perl script relative to this file

# A field configured not visible reaches every viewer.
SAG3_a_hidden_shown     | classes/chip_filters.php | sag3_viewer_hidden.pl
#   -> test_student_gets_only_the_field_visible_to_all
#   -> test_editing_teacher_gets_the_teacher_field_too
#   -> test_nobody_gets_the_hidden_field
#   -> test_a_warm_cache_is_still_filtered_per_viewer

# A teacher-only field reaches students: the per-course capability check is skipped.
SAG3_b_teachers_shown   | classes/chip_filters.php | sag3_viewer_teachers.pl
#   -> test_student_gets_only_the_field_visible_to_all
#   -> test_a_warm_cache_is_still_filtered_per_viewer
