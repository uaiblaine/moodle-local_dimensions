# Mutation spec for the template metadata cache - run from the repo with
# `mdl mutate moodle-local_dimensions "$PWD/mutations/template_metadata_cache.conf" --stack m502b`
# (mdl mutate resolves the spec path from the current directory, so pass it absolute).
#
# Each line breaks ONE guard in classes/template_metadata_cache.php and names the tests that must go red.
#
#     tag | file relative to the repo | perl script relative to this file

# The batch reader returns a freshly built payload unnormalised, which was the defect: a cold read
# lacked the resolved enrollmentfilter and singlecourseredirect keys that a warm read carries.
TMC_A_many_miss_raw        | classes/template_metadata_cache.php | tmc_a_many_miss_raw.pl
#   -> test_get_metadata_for_many_cold_read_equals_warm_read
#   -> test_get_metadata_for_many_mixed_batch_returns_one_shape
#   -> test_single_and_batch_readers_agree

# The same defect in the single reader.
TMC_B_single_miss_raw      | classes/template_metadata_cache.php | tmc_b_single_miss_raw.pl
#   -> test_get_template_metadata_cold_read_equals_warm_read
#   -> test_single_and_batch_readers_agree

# Decode the cascade selects by parsing "key|label" again: every field provisioned with plain
# labels reads as inherit, so a template's own override is ignored.
TMC_C_decoder_parses_text  | classes/template_metadata_cache.php | tmc_c_decoder_parses_text.pl
#   -> test_get_metadata_for_many_cold_read_equals_warm_read
#   -> test_get_metadata_for_many_mixed_batch_returns_one_shape
#   -> test_get_template_metadata_cold_read_equals_warm_read
#   -> test_warm_read_follows_the_site_settings

# Resolve the inherited keys when storing and serve hits as stored: cold and warm reads still agree,
# but a cached template no longer follows a change to the site settings.
TMC_D_resolve_before_store | classes/template_metadata_cache.php | tmc_d_resolve_before_store.pl
#   -> test_warm_read_follows_the_site_settings

# Stop decoding a field whose options are spelt "key|label".
TMC_E_key_label_rejected   | classes/template_metadata_cache.php | tmc_e_key_label_rejected.pl
#   -> test_key_label_options_decode_by_position
