name: ci

# workflow_dispatch is the manual escape hatch: without it, a push whose commits
# carry a skip-ci marker leaves code unvalidated with no way to launch a run short
# of pushing another commit.
#
# CI is not the only gate any more: the plugin is mounted on the local m405/m501/m502
# stacks (moodle-dev/plugins.conf), so run `mdl ci moodle-local_dimensions` before
# pushing. Visual checks on 4.5 need a browser at http://localhost:8405 — none of the
# static gates can see a Bootstrap class that resolves to nothing.
on:
  push:
    # Filtered to the merge targets. Without this, a push to a feature branch
    # ran the whole pipeline AND the pull_request event ran it again on the same
    # commit - double, for no extra information.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these when the supported range changes.
  # The highest branch runs the full PHP x DB matrix; older branches run
  # PostgreSQL only. PHPUnit and Behat run on every runtime leg.
  #
  # enrol_apply is checked out beside the plugin so the enrolability tests in
  # calculator_enrol_predicate_test can run against the real plugin instead of
  # skipping. It is emphatically NOT a runtime dependency: local_dimensions
  # declares no $plugin->dependencies, reaches enrol_apply only through an
  # is_callable() guard, and installs and runs unchanged on a site that has
  # never heard of it — optional_enrol_apply_test pins every half of that
  # promise, source scan included.
  # This input only populates the CI test site.
  #
  # block_dimensions is checked out beside the plugin for the OTHER cross-repo
  # reason: the two share one colour-token contract under two frankenstyle
  # prefixes, and colour_tokens_test::test_token_block_is_identical_to_the_sibling
  # compares the two blocks declaration by declaration. Without the checkout that
  # test SKIPS, and a skip nobody notices is how a cross-repo lock quietly stops
  # running - which is why test_ci_checks_out_the_family_sibling reads this file
  # and fails the build for any job that drops the line. It is not a runtime
  # dependency either: neither plugin declares the other in $plugin->dependencies
  # and each installs and runs standalone.
  #
  # 4.05 lists ONLY block_dimensions, and must: enrol_apply declares
  # $plugin->supported = [501, 502], so checking it out there would offer
  # Moodle 4.5 a plugin it cannot install. The apply tests skip on that leg,
  # which is the truth — the integration cannot exist on 4.5. block_dimensions
  # declares [405, 502], so it installs on every leg this plugin runs.
  ci-502:
    name: Moodle 5.02
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_502_STABLE
      plugin-dependencies: |
        uaiblaine/moodle-enrol_apply,master
        uaiblaine/moodle-block_dimensions,main

  ci-501:
    name: Moodle 5.01
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_501_STABLE
      one-db-only: true
      plugin-dependencies: |
        uaiblaine/moodle-enrol_apply,master
        uaiblaine/moodle-block_dimensions,main

  ci-405:
    name: Moodle 4.05
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_405_STABLE
      one-db-only: true
      plugin-dependencies: |
        uaiblaine/moodle-block_dimensions,main
