name: ci

# workflow_dispatch is the manual escape hatch: without it, a push whose commits
# carry a skip-ci marker leaves code unvalidated with no way to launch a run short
# of pushing another commit.
on:
  push:
    # Filtered to the merge targets: a feature branch is covered by its
    # pull_request run, so a push there would run the same commit twice.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One branch per Moodle version: this branch serves Moodle 5.3 only ($plugin->supported =
  # [503, 503]), so it has one job, with the full PHP x DB matrix. The other versions live on their
  # own MOODLE_*_STABLE branches, each with its own ci.yml.
  #
  # plugin-dependencies only populates the CI test site; no entry is a runtime dependency
  # (version.php declares no $plugin->dependencies), and each names the branch that serves
  # the same Moodle version.
  #
  # block_dimensions is checked out because the two plugins share one colour-token contract
  # under two frankenstyle prefixes, and
  # colour_tokens_test::test_token_block_is_identical_to_the_sibling compares the two blocks
  # and skips without the checkout. test_ci_checks_out_the_family_sibling reads this file and
  # fails the build for any job that drops the line.
  #
  # enrol_apply is checked out so the enrolability tests in calculator_enrol_predicate_test
  # run against the real plugin instead of skipping. local_dimensions reaches it only through
  # an is_callable() guard and runs unchanged without it (pinned by optional_enrol_apply_test).
  # It has no branch for Moodle 4.5.
  #
  # local_unlistedcourses is the optional provider behind the useunlistedcourses switch, reached
  # only through UNLISTED_API behind unlisted_available(); it is not a runtime dependency. It
  # is checked out so the real-plugin cases of enrolment_provider_unlisted_test and
  # enrolment_provider_test run instead of skipping; it has no branch below 5.2.
  # test_ci_checks_out_unlistedcourses_where_it_exists fails the build if the line is dropped.
  ci-503:
    name: Moodle 5.03
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_503_STABLE
      plugin-dependencies: |
        uaiblaine/moodle-enrol_apply,master
        uaiblaine/moodle-block_dimensions,main
        uaiblaine/moodle-local_unlistedcourses,MOODLE_503_STABLE
