name: ci

# workflow_dispatch is the manual escape hatch: without it, a push whose commits
# carry a skip-ci marker leaves code unvalidated with no way to launch a run short
# of pushing another commit.
on:
  push:
    # Filtered to the merge targets: a feature branch is covered by its
    # pull_request run, so a push there would run the same commit twice.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these when the supported range changes.
  # The highest branch runs the full PHP x DB matrix; older branches run
  # PostgreSQL only. PHPUnit and Behat run on every runtime leg.
  #
  # plugin-dependencies only populates the CI test site; neither entry is a
  # runtime dependency (version.php declares no $plugin->dependencies).
  #
  # enrol_apply is checked out so the enrolability tests in
  # calculator_enrol_predicate_test run against the real plugin instead of
  # skipping. local_dimensions reaches it only through an is_callable() guard
  # and runs unchanged without it (pinned by optional_enrol_apply_test).
  #
  # block_dimensions is checked out because the two plugins share one
  # colour-token contract under two frankenstyle prefixes, and
  # colour_tokens_test::test_token_block_is_identical_to_the_sibling compares the
  # two blocks and skips without the checkout.
  # test_ci_checks_out_the_family_sibling reads this file and fails the build for
  # any job that drops the line.
  #
  # 4.05 lists only block_dimensions: enrol_apply declares
  # $plugin->supported = [501, 502] and cannot install on Moodle 4.5, so the
  # apply tests skip on that leg. block_dimensions declares [405, 502].
  ci-502:
    name: Moodle 5.02
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_502_STABLE
      plugin-dependencies: |
        uaiblaine/moodle-enrol_apply,master
        uaiblaine/moodle-block_dimensions,main

  ci-501:
    name: Moodle 5.01
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_501_STABLE
      one-db-only: true
      plugin-dependencies: |
        uaiblaine/moodle-enrol_apply,master
        uaiblaine/moodle-block_dimensions,main

  ci-405:
    name: Moodle 4.05
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_405_STABLE
      one-db-only: true
      plugin-dependencies: |
        uaiblaine/moodle-block_dimensions,main
